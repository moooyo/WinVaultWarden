<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinVaultWarden passkey get test</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: Canvas;
      color: CanvasText;
    }

    main {
      display: grid;
      gap: 18px;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    input,
    select,
    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 8px 10px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      width: fit-content;
      padding: 8px 14px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 640px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>WinVaultWarden passkey get test</h1>

    <p>
      Serve this page from localhost, open the Debug demo vault, then request a
      passkey. The demo vault includes a discoverable passkey for rpId
      localhost.
    </p>

    <div class="row">
      <label>
        rpId
        <input id="rpId" autocomplete="off">
      </label>

      <label>
        userVerification
        <select id="userVerification">
          <option value="preferred">preferred</option>
          <option value="required">required</option>
          <option value="discouraged">discouraged</option>
        </select>
      </label>
    </div>

    <label>
      mediation
      <select id="mediation">
        <option value="">required (default, shows the picker)</option>
        <option value="conditional">conditional (autofill, native only)</option>
        <option value="silent">silent (passive, native only)</option>
      </select>
    </label>

    <label>
      allowCredentials credential id (optional base64url)
      <input id="credentialId" autocomplete="off" placeholder="leave blank for discoverable credential">
    </label>

    <div class="row">
      <button id="requestButton" type="button">Request passkey</button>
      <button id="abortButton" type="button">Abort</button>
    </div>

    <label>
      Result
      <textarea id="result" readonly></textarea>
    </label>
  </main>

  <script>
    // Stable, generic messages keyed only by DOMException.name. The page never displays
    // the raw exception text or any extension/native response text, so nothing beyond a
    // fixed per-name string can reach this test page's output.
    const STABLE_MESSAGES = {
      NotAllowedError: "request denied or not completed",
      SecurityError: "origin/RP failed a security check",
      AbortError: "request was aborted",
      InvalidStateError: "credential already excluded",
      NotSupportedError: "operation not supported",
    };

    const rpIdInput = document.getElementById("rpId");
    const credentialIdInput = document.getElementById("credentialId");
    const userVerificationInput = document.getElementById("userVerification");
    const mediationInput = document.getElementById("mediation");
    const result = document.getElementById("result");
    const requestButton = document.getElementById("requestButton");
    const abortButton = document.getElementById("abortButton");

    let controller = null;

    rpIdInput.value = location.hostname || "localhost";
    requestButton.addEventListener("click", requestPasskey);
    abortButton.addEventListener("click", () => controller?.abort());

    async function requestPasskey() {
      result.value = "Waiting for WebAuthn response...";
      controller = new AbortController();

      try {
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);

        const allowCredentials = credentialIdInput.value.trim()
          ? [{
              id: fromBase64Url(credentialIdInput.value.trim()),
              type: "public-key",
              transports: ["internal"],
            }]
          : [];

        const options = {
          signal: controller.signal,
          publicKey: {
            challenge,
            rpId: rpIdInput.value.trim() || undefined,
            allowCredentials,
            timeout: 60000,
            userVerification: userVerificationInput.value,
          },
        };
        if (mediationInput.value) {
          options.mediation = mediationInput.value;
        }

        const credential = await navigator.credentials.get(options);

        result.value = JSON.stringify(credential.toJSON(), null, 2);
      } catch (error) {
        const name = error.name || "Error";
        result.value = `${name}: ${STABLE_MESSAGES[name] || "request failed"}`;
      }
    }

    function fromBase64Url(value) {
      const base64 = value.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(value.length / 4) * 4, "=");
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let index = 0; index < binary.length; index++) {
        bytes[index] = binary.charCodeAt(index);
      }

      return bytes.buffer;
    }
  </script>
</body>
</html>
